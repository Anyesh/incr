[env]
# k8s-openapi's build.rs panics if no v1_* API-version feature is enabled,
# and dev-dependency features don't unify into a lib-only build under
# resolver = "2" (incr-kube's dev-dependency enables v1_36). Setting it
# here covers CI's lib-only clippy job, local `cargo check`/`doc`, and
# rust-analyzer in one place. Must match the version incr-kube's
# k8s-openapi dev-dependency feature names, or the build script panics
# on two distinct enabled versions instead of zero.
K8S_OPENAPI_ENABLED_VERSION = { value = "1.36", force = true }

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:67108864"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,67108864"]
