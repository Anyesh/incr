name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [incr-core, incr-compute, incr-concurrent, incr-kube, incr-persist]
        include:
          - crate: incr-persist
            features: --features sqlite
    env:
      CRATE: ${{ matrix.crate }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p "$CRATE" --release $FEATURES
      - run: cargo test -p "$CRATE" --release $FEATURES
        env:
          INCR_MAX_DEPTH: "1"
          INCR_TEST_ALL_REPLAYABLE: "1"

  # The release job above never runs the debug-only lock-order check, so
  # this covers every crate's tests in debug. The Python crates are
  # extension-module cdylibs tested by the Python job, and incr-wasm-tests
  # runs in the wasm job.
  test-debug:
    name: Test (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude incr-python --exclude incr-concurrent-python --exclude incr-wasm-tests --features incr-persist/sqlite
      - run: cargo test --workspace --exclude incr-python --exclude incr-concurrent-python --exclude incr-wasm-tests --features incr-persist/sqlite
        env:
          INCR_MAX_DEPTH: "1"
          INCR_TEST_ALL_REPLAYABLE: "1"

  wasm:
    name: wasm32 (Node)
    runs-on: ubuntu-latest
    env:
      # wasm-bindgen-test-runner passes these to node; together with the
      # crate's 8 MiB shadow stack this lets debug nest 5,000 levels.
      NODE_ARGS: --stack-size=7000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen version incr-wasm-tests resolves to.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo test -p incr-wasm-tests --target wasm32-unknown-unknown
      - run: cargo test -p incr-wasm-tests --target wasm32-unknown-unknown --release

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 1.89 --profile minimal
      - run: rustup target add --toolchain 1.88 wasm32-unknown-unknown
      # pyo3's build script needs an interpreter even for cargo check.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check -p incr-core -p incr-compute -p incr-concurrent -p incr-python -p incr-concurrent-python --all-features --all-targets
      - run: cargo +1.89 check -p incr-persist -p incr-kube --all-features --all-targets
      - run: cargo +1.88 check -p incr-core --lib --target wasm32-unknown-unknown
      - run: cargo +1.88 check -p incr-wasm-tests --all-targets --target wasm32-unknown-unknown

  miri:
    name: Miri
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [incr-core, incr-kube]
    env:
      CRATE: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p "$CRATE" --lib --test stress -- --test-threads=1

  loom:
    name: Loom (${{ matrix.model }}, bound ${{ matrix.bound }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { model: "loom_models::loom_chain_cutoff", bound: 2 }
          - { model: "loom_models::loom_fan_out", bound: 2 }
          - { model: "walk_ring::loom_tests::loom_walk_ring", bound: 2 }
          - { model: "loom_models::loom_compute_races_delete", bound: 3 }
          - { model: "loom_models::loom_recovered_node_under_set", bound: 3 }
          - { model: "loom_models::loom_walk_scan_after_same_count_install", bound: 3 }
          - { model: "loom_models::loom_walk_scan_after_overflow_to_inline_install", bound: 3 }
          - { model: "loom_models::loom_new_dependent_races_set", bound: 3 }
          - { model: "loom_models::loom_clean_get_vs_recycle", bound: 3 }
          - { model: "loom_models::loom_clean_get_vs_recycle_new_segment", bound: 3 }
          - { model: "loom_models::loom_set_vs_recycle", bound: 3 }
          - { model: "loom_models::loom_arena_read_during_growth", bound: 3 }
          - { model: "loom_models::loom_reader_during_directory_growth", bound: 3 }
          - { model: "loom_models::loom_cycle_land_under_set", bound: 2 }
          - { model: "loom_models::loom_group_verify_under_set", bound: 2 }
          - { model: "loom_models::loom_group_claim_partial", bound: 2 }
          - { model: "loom_models::loom_group_claim_contended", bound: 2 }
          - { model: "loom_models::loom_wound_keeps_a_member_computed_alone_in_its_group", bound: 2 }
          - { model: "loom_models::loom_cycle_break_race", bound: 2 }
          - { model: "loom_models::loom_fixpoint_two_entries", bound: 2 }
          - { model: "loom_models::loom_fixpoint_iterate_under_set", bound: 2 }
          - { model: "loom_models::loom_cross_thread_cycle", bound: 2 }
          - { model: "loom_models::loom_wound_retry", bound: 2 }
          - { model: "loom_models::loom_wait_deregister", bound: 2 }
          - { model: "loom_models::rested_reservation_owner_waits_in_the_engine", bound: 2 }
          - { model: "loom_models::table_miss_race_under_set", bound: 2 }
          - { model: "loom_models::table_hit_vs_publish", bound: 2 }
          - { model: "loom_models::table_hit_vs_remove_rehash", bound: 2 }
          - { model: "loom_models::tree_claim_vs_compute", bound: 2 }
          - { model: "loom_models::tree_claim_rollback_under_set", bound: 2 }
          - { model: "loom_models::child_sweep_vs_reader", bound: 2 }
          - { model: "loom_models::child_create_and_reuse", bound: 2 }
          - { model: "loom_models::replay_release_vs_reader", bound: 2 }
          - { model: "loom_models::virtual_hit_claim_race", bound: 2 }
          - { model: "loom_models::doom_reservations_cross_direct", bound: 2 }
          - { model: "loom_models::doom_reservations_cross_held", bound: 2 }
          - { model: "loom_models::walk_listing_passes_a_reader_its_read_joins", bound: 2 }
          - { model: "loom_models::walk_listing_holds_an_earlier_reader_until_its_read_ends", bound: 2 }
          - { model: "loom_models::walk_listing_ends_where_its_read_enters_user_code", bound: 2 }
          - { model: "loom_models::walk_listing_ends_at_its_nodes_settled_landing", bound: 2 }
          - { model: "loom_models::discard_under_set", bound: 2 }
          - { model: "loom_models::vframe_failed_provenance", bound: 2 }
          - { model: "loom_models::vframe_failed_provenance_relanded", bound: 2 }
          - { model: "loom_models::drain_vs_set", bound: 2 }
          - { model: "loom_models::flip_racing_a_contained_hold_releases_the_ticket", bound: 2 }
          - { model: "loom_models::loom_held_landing_publishes_under_set", bound: 2 }
          - { model: "loom_models::loom_held_group_record_precedes_state", bound: 2 }
          - { model: "loom_models::loom_cross_runtime_held_wait", bound: 2 }
          - { model: "loom_models::loom_held_episode_wound_retracts_values", bound: 2 }
          - { model: "loom_models::loom_own_landed_reread_matches_local", bound: 2 }
          - { model: "loom_models::loom_released_group_members_stay_grouped_until_the_read_ends", bound: 2 }
          - { model: "loom_seed_models::seed_vs_set", bound: 2 }
          - { model: "loom_seed_models::seed_vs_dep_recompute", bound: 2 }
          - { model: "loom_seed_models::seed_vs_reader", bound: 2 }
          - { model: "loom_seed_models::inspect_vs_recompute", bound: 2 }
    env:
      RUSTFLAGS: --cfg loom -D warnings
      LOOM_MAX_PREEMPTIONS: ${{ matrix.bound }}
      LOOM_MAX_BRANCHES: 100000
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - run: cargo test -p incr-core --release --lib -- --exact "$MODEL"

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [incr-core, incr-kube]
    env:
      RUSTFLAGS: -Zsanitizer=thread
      CRATE: ${{ matrix.crate }}
      # Large tests take their size from test_size, which shrinks them here
      # because a sanitized debug build is too slow at full size.
      INCR_TEST_REDUCED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p "$CRATE" --lib --test stress

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: incr-core
            bench: chain
          - crate: incr-core
            bench: operators
          - crate: incr-kube
            bench: keyed_upsert
    env:
      CRATE: ${{ matrix.crate }}
      BENCH: ${{ matrix.bench }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p "$CRATE" --bench "$BENCH" -- --output-format bencher | tee bench-output.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.crate }}-${{ matrix.bench }}
          path: bench-output.txt

  examples:
    name: Example apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p incr-concurrent-server -p incr-spreadsheet -p incr-persist-config
      - run: cargo test --release -p incr-persist-config

  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      # maturin develop resolves the target environment from VIRTUAL_ENV,
      # so the venv must be activated, not merely invoked by path.
      - run: |
          python -m venv .ci-venv
          source .ci-venv/bin/activate
          pip install maturin pytest
          maturin develop --release --manifest-path crates/incr-python/Cargo.toml
          maturin develop --release --manifest-path crates/incr-concurrent-python/Cargo.toml
          python -m pytest examples/tests/python/ -q

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
