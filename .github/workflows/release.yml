name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check-release-versions.sh
      - run: bash scripts/check-release-notes.sh
      - run: cargo test --release -p incr-core -p incr-compute -p incr-concurrent -p incr-kube -p incr-persist --features incr-persist/sqlite

  publish-crates:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish incr-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-or-confirm.sh incr-core
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish incr-compute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-or-confirm.sh incr-compute
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish incr-concurrent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-or-confirm.sh incr-concurrent
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish incr-kube
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-or-confirm.sh incr-kube
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish incr-persist
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-or-confirm.sh incr-persist

  publish-pypi:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - crates/incr-python/Cargo.toml
          - crates/incr-concurrent-python/Cargo.toml
    env:
      MANIFEST: ${{ matrix.manifest }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - name: Build and publish
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: maturin publish --skip-existing --manifest-path "$MANIFEST"

  publish-pypi-aarch64:
    name: Publish the Linux aarch64 incr-compute wheel to PyPI
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: v1.15.0
          manylinux: "2_28"
          args: --release --out dist --manifest-path crates/incr-python/Cargo.toml
      - name: Publish
        uses: PyO3/maturin-action@v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        with:
          maturin-version: v1.15.0
          command: upload
          args: --skip-existing dist/*
