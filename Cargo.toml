[workspace]
resolver = "2"
members = ["crates/incr-bench", "crates/incr-compute", "crates/incr-concurrent", "crates/incr-concurrent-python", "crates/incr-core", "crates/incr-kube", "crates/incr-persist", "crates/incr-python", "examples/concurrent-server", "examples/persist-config", "examples/spreadsheet"]

[workspace.package]
version = "0.2.0-beta.5"

[workspace.dependencies]
incr-core = { version = "0.2.0-beta.5", path = "crates/incr-core" }
incr-concurrent = { version = "0.2.0-beta.5", path = "crates/incr-concurrent" }
