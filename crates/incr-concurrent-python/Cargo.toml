[package]
name = "incr-concurrent-python"
version.workspace = true
edition = "2021"
rust-version = "1.89"
description = "Python bindings for the thread-safe incr incremental computation engine"
license = "Apache-2.0"
publish = false

[lib]
name = "incr_concurrent"
crate-type = ["cdylib"]
doc = false

[features]
conformance = ["incr-python-persist/conformance"]

[dependencies]
incr_concurrent = { package = "incr-concurrent", version = "=0.2.0-beta.7", path = "../incr-concurrent" }
incr-python-persist = { path = "../incr-python-persist" }
incr-python-protocol = { path = "../incr-python-protocol" }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
