[package]
name = "incr-core"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "Shared core for the incr family. Strategy-parameterized incremental computation engine. Used via incr-compute (single-threaded) or incr-concurrent (Send + Sync)."
license.workspace = true
repository = "https://github.com/Anyesh/incr"
keywords = ["incremental", "computation", "reactive", "dataflow"]
categories = ["algorithms", "data-structures"]

[dependencies]
haphazard = "0.1"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[features]
# Quiescent invariant checks for other crates' tests; never for releases.
test-hooks = []
# The yield hook (`Runtime::set_yield_hook`); without it no loop ticks.
yield-hook = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[test]]
name = "yield_hook"
required-features = ["yield-hook"]

[[bench]]
name = "chain"
harness = false

[[bench]]
name = "operators"
harness = false

[[bench]]
name = "graph"
harness = false

[[bench]]
name = "compute_stats"
harness = false

[[bench]]
name = "graph_summary"
harness = false

[[bench]]
name = "icount"
harness = false

[[bench]]
name = "released_hot"
harness = false
required-features = ["test-hooks"]
