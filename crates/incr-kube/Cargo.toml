[package]
name = "incr-kube"
version.workspace = true
edition = "2021"
description = "Keyed-upsert layer over incr-concurrent for Kubernetes-style watch-event state (replace/delete by key, staleness rejection)."
license = "Apache-2.0"
repository = "https://github.com/Anyesh/incr"
keywords = ["incremental", "computation", "kubernetes", "kube-rs", "concurrent"]
categories = ["algorithms", "data-structures", "concurrency"]

[dependencies]
incr-concurrent.workspace = true
kube = { version = "4.2", default-features = false, features = ["runtime"] }
futures = "0.3"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_36"] }
tokio = { version = "1", features = ["macros", "rt"] }

[[bench]]
name = "keyed_upsert"
harness = false
