[package]
name = "incr-persist"
version.workspace = true
edition = "2021"
description = "Durable, shareable state for incr: keeps a runtime's inputs in sync with an ordered operation log held by a pluggable backend."
license = "Apache-2.0"
repository = "https://github.com/Anyesh/incr"
keywords = ["incremental", "persistence", "event-sourcing", "log"]
categories = ["algorithms", "database"]

[features]
backend-tests = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
thiserror = "2.0.21"
crc32fast = "1.5.2"

[dev-dependencies]
# Self dependency so that plain `cargo test -p incr-persist` runs the
# conformance suite against MemoryBackend without passing --features.
incr-persist = { path = ".", features = ["backend-tests"] }
proptest = "1.11"
tempfile = "3.27"
