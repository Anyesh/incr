[package]
name = "incr-python-persist"
version.workspace = true
edition = "2021"
rust-version = "1.89"
description = "The persistence layer shared by incr's Python bindings"
license.workspace = true
publish = false

[lib]
doc = false

[features]
conformance = ["incr-persist/backend-tests"]
gil-checks = ["incr-python-protocol/gil-checks", "incr-persist/frame-limit"]

[dependencies]
incr-core = { workspace = true, features = ["yield-hook"] }
incr-persist = { path = "../incr-persist", features = ["yield-hook"] }
incr-python-protocol = { path = "../incr-python-protocol", features = ["persist"] }
pyo3 = "0.26"
