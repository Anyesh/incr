[package]
name = "incr-python-protocol"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "The exception and unwind protocol shared by incr's Python bindings"
license.workspace = true
publish = false

[lib]
doc = false

[features]
persist = ["dep:serde"]
gil-checks = []

[dependencies]
incr-core = { workspace = true, features = ["yield-hook"] }
pyo3 = "0.26"
serde = { version = "1.0.229", default-features = false, optional = true }
