[package]
name = "incr-python"
version.workspace = true
edition = "2021"
rust-version = "1.89"
description = "Python bindings for the incr single-threaded incremental computation engine"
license = "Apache-2.0"
publish = false

[lib]
name = "incr"
crate-type = ["cdylib"]
doc = false

[features]
conformance = ["incr-persist/backend-tests"]

[dependencies]
incr_compute = { package = "incr-compute", version = "=0.2.0-beta.7", path = "../incr-compute" }
incr-core.workspace = true
incr-persist = { path = "../incr-persist" }
incr-python-protocol = { path = "../incr-python-protocol", features = ["persist"] }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
